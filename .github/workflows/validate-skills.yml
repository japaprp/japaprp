name: Validate engineering skills

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/copilot-instructions.md"
      - "skills/**"
      - "scripts/validate_skills.py"
      - "scripts/run_router_eval.py"
      - "scripts/test_activation_trigger.mjs"
      - "scripts/adversarial_review_gate.py"
      - "scripts/test_adversarial_review_gate.py"
      - ".github/workflows/validate-skills.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - ".github/copilot-instructions.md"
      - "skills/**"
      - "scripts/validate_skills.py"
      - "scripts/run_router_eval.py"
      - "scripts/test_activation_trigger.mjs"
      - ".github/workflows/validate-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills and routing eval dataset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill structure and eval cases
        run: python scripts/validate_skills.py
      - name: Check local behavioral evaluation runner syntax
        run: python -m py_compile scripts/run_router_eval.py
      - name: Smoke-test local runner and dataset loading
        run: python scripts/run_router_eval.py --list
      - name: Run adversarial decision gate regression tests
        run: python -m unittest discover -s scripts -p 'test_adversarial_review_gate.py' -v
      - name: Run adversarial decision gate self-test
        run: python scripts/adversarial_review_gate.py --self-test
      - name: Check activation regression script syntax
        run: node --check scripts/test_activation_trigger.mjs
      - name: Run deterministic activation regression
        run: node scripts/test_activation_trigger.mjs
