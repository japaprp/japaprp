name: Validate engineering skills

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/copilot-instructions.md"
      - "skills/**"
      - "scripts/validate_skills.py"
      - "scripts/validate_registries.py"
      - "scripts/audit_capability_coverage.py"
      - "scripts/test_capability_engines.mjs"\n      - "scripts/test_agent_orchestration.mjs"
      - "scripts/test_registry_routing.mjs"
      - "scripts/run_router_eval.py"
      - "scripts/test_activation_trigger.mjs"
      - ".github/workflows/validate-skills.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - ".github/copilot-instructions.md"
      - "skills/**"
      - "scripts/validate_skills.py"
      - "scripts/validate_registries.py"
      - "scripts/test_registry_routing.mjs"
      - "scripts/run_router_eval.py"
      - "scripts/test_activation_trigger.mjs"
      - ".github/workflows/validate-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills and routing eval dataset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill structure and eval cases
        run: python scripts/validate_skills.py
      - name: Validate project and capability registries
        run: python scripts/validate_registries.py
      - name: Audit capability coverage
        run: python scripts/audit_capability_coverage.py
      - name: Check capability engine regression syntax
        run: node --check scripts/test_capability_engines.mjs
      - name: Run capability engine regression
        run: node scripts/test_capability_engines.mjs
      - name: Check agent orchestration regression syntax\n        run: node --check scripts/test_agent_orchestration.mjs\n      - name: Run deterministic agent orchestration regression\n        run: node scripts/test_agent_orchestration.mjs\n      - name: Check local behavioral evaluation runner syntax
        run: python -m py_compile scripts/run_router_eval.py
      - name: Smoke-test local runner and dataset loading
        run: python scripts/run_router_eval.py --list
      - name: Check activation regression script syntax
        run: node --check scripts/test_activation_trigger.mjs
      - name: Run deterministic activation regression
        run: node scripts/test_activation_trigger.mjs
      - name: Check registry routing regression syntax
        run: node --check scripts/test_registry_routing.mjs
      - name: Run deterministic registry routing regression
        run: node scripts/test_registry_routing.mjs
